name: Publish .NET package to NuGet.org

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful .NET CI run ID for PageBloomFilter 1.3.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify release branch, CI run and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          if [[ ! "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "run_id must be numeric" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/release" ]]; then
            echo "release workflow must run from refs/heads/release" >&2
            exit 1
          fi

          run_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"

          if ! jq -e --arg sha "${GITHUB_SHA}" '
            .status == "completed" and
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .path == ".github/workflows/ci-dotnet.yml" and
            .head_branch == "release" and
            .head_sha == $sha
          ' <<<"${run_json}" >/dev/null; then
            echo "CI run is not a successful ci-dotnet run for ${GITHUB_SHA}" >&2
            jq '{id, status, conclusion, event, path, head_sha}' <<<"${run_json}" >&2
            exit 1
          fi

          artifacts_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"

          if ! jq -e '
            [.artifacts[] | select(.expired == false) | .name] ==
            ["dotnet-nuget"]
          ' <<<"${artifacts_json}" >/dev/null; then
            echo "CI run does not have the exact expected unexpired artifact" >&2
            jq '[.artifacts[] | {name, expired}]' <<<"${artifacts_json}" >&2
            exit 1
          fi

  publish:
    name: Publish to NuGet.org
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download approved NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: dotnet-nuget
          path: artifacts/nuget

      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          if [[ "${#packages[@]}" -ne 1 ||
                "${packages[0]}" != "artifacts/nuget/PageBloomFilter.1.3.0.nupkg" ]]; then
            printf 'unexpected NuGet package set:\n' >&2
            printf '  %s\n' "${packages[@]:-<none>}" >&2
            exit 1
          fi
          sha256sum "${packages[0]}"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Exchange GitHub OIDC token for a temporary NuGet API key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: peterrk

      - name: Publish package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push artifacts/nuget/PageBloomFilter.1.3.0.nupkg \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json
